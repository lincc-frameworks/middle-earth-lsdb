ServerName ${SERVER_NAME}

Listen 8080

# Two sites on one port, told apart by the Host header the VM's reverse proxy
# passes on. The first virtual host is the default: it also answers for the
# VM's own name, localhost, and anything unrecognized.

# ── data.lsdb.io: the catalog browser and the HATS catalogs ─────────────────
<VirtualHost *:8080>
    ServerName data.lsdb.io
    ServerAlias ${SERVER_NAME}

    # The website (built into the image).
    DocumentRoot /srv/data.lsdb.io

    <Directory /srv/data.lsdb.io>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # The site is a single-page app with prerendered pages. Unknown paths get
    # the app (which shows its own "not found" page) with a 404 status. On the
    # legacy host this line was the site's .htaccess.
    ErrorDocument 404 /index.html

    # The HATS catalogs. compose.yaml bind-mounts the whole catalog directory
    # read-only at /srv/hats, but only /srv/hats/published is served: a
    # directory of symlinks, one per public catalog, whose names are the
    # public names. A catalog without a link
    # there has no URL. https://data.lsdb.io/hats/<name>/... is what LSDB
    # clients read, and the directory listings are part of the interface.
    Alias /hats /srv/hats/published

    # Nothing in the mount is served except through the links above.
    <Directory /srv/hats>
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /srv/hats/published>
        Options +Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        IndexOptions FancyIndexing NameWidth=* DescriptionWidth=50 SuppressIcon FoldersFirst Charset=UTF-8

        # Descriptions shown in the listings. On the legacy host these were
        # html/hats/.htaccess, edited by hand; .htaccess files are not read
        # here. When publishing a catalog, add its line.
        AddDescription "Rubin Alert Archive (Frozen July 14)" rubin_alert_archive rubin_alert_archive/
        AddDescription "Rubin Data Preview 2" dp2 dp2/
        AddDescription "Rubin Data Preview 1" dp1 dp1/
        AddDescription "Euclid Quick DR1" euclid_q1 euclid_q1/
        AddDescription "ZTF alerts ≥ 20 detections" alerce alerce/
        AddDescription "DECam Local Volume Exploration Survey DR2" delve_dr2 delve_dr2/
        AddDescription "DECam Local Volume Exploration Survey DR3 Gold" delve_dr3_gold delve_dr3_gold/
        AddDescription "DELVE DR2 main catalog" delve/delve_dr2 delve/delve_dr2/
        AddDescription "DECam Local Volume Exploration Survey" delve delve/
        AddDescription "Dark Energy Survey Y6 Gold" des/des_y6_gold des/des_y6_gold/
        AddDescription "DESI DR1 redshift catalog (zall-pix-iron)" desi/desi_dr1_zcat desi/desi_dr1_zcat/
        AddDescription "Dark Energy Spectroscopic Instrument DR1" desi desi/
        AddDescription "Dark Energy Survey DR2" des des/
        AddDescription "eROSITA-DE DR2 eRASS:3 Main catalogue" erosita_dr2_erass3 erosita_dr2_erass3/
        AddDescription "eROSITA-DE DR1" erosita erosita/
        AddDescription "Gaia DR3 Epoch Photometry" gaia_dr3_epoch_phot gaia_dr3_epoch_phot/
        AddDescription "Gaia DR3 gaia_source" gaia_dr3 gaia_dr3/
        AddDescription "Gaia EDR3 Bailer-Jones" gaia_edr3_distances gaia_edr3_distances/
        AddDescription "HEASARC Fermi Photon" heasarc_photon heasarc_photon/
        AddDescription "Sloan Digital Sky Survey DR7" sdss_dr7_spectra sdss_dr7_spectra/
        AddDescription "Sloan Digital Sky Survey DR18 SpecPhotoAll" sdss_dr18_specphotoall sdss_dr18_specphotoall/
        AddDescription "ZTF DR14 AXS" ztf_dr14/ztf_object ztf_dr14/ztf_object_10arcs ztf_dr14/ztf_source
        AddDescription "ZTF DR16 Zubercal" ztf_dr16/zubercal ztf_dr16/zubercal/
        AddDescription "ZTF DR20 Zubercal" ztf_dr20/zubercal ztf_dr20/zubercal/
        AddDescription "Zwicky Transient Facility DR14" ztf_dr14 ztf_dr14/
        AddDescription "Zwicky Transient Facility DR16" ztf_dr16 ztf_dr16/
        AddDescription "Zwicky Transient Facility DR20" ztf_dr20 ztf_dr20/
        AddDescription "Zwicky Transient Facility DR22" ztf_dr22 ztf_dr22/
        AddDescription "TESS Input Catalog v8.2" tess/tic tess/tic/
        AddDescription "TESS Lightcurve" tess/tess_lightcurve tess/tess_lightcurve/
        AddDescription "Transiting Exoplanet Survey Satellite" tess tess/
        AddDescription "Near-Earth Objects WISE (year 8)" wise/neowise wise/neowise/
        AddDescription "AllWISE Source Catalog" wise/allwise wise/allwise/
        AddDescription "Wide-field Infrared Survery Explorer" wise wise/
        AddDescription "Two Micron All Sky Survey (2MASS)" two_mass two_mass/
        AddDescription "AAVSO Variable Star Index (VSX)" vsx vsx/
        AddDescription "SkyMapper Southern Sky Survey DR4 (2024-02-05)" skymapper_dr4 skymapper_dr4/
        AddDescription "Hyper Supreme Cam PDR3" hsc_pdr3 hsc_pdr3/
        AddDescription "Mock Data Preview 1" mock_dp1 mock_dp1/
        AddDescription "Transient Name Server (TNS)" tns tns/
        AddDescription "Legacy Survey DR10.1" legacysurvey_dr10.1 legacysurvey_dr10.1/
        AddDescription "The Monster (20250219)" the_monster the_monster/
    </Directory>
</VirtualHost>

# ── lsdb.io: the landing page ───────────────────────────────────────────────
<VirtualHost *:8080>
    ServerName lsdb.io
    # lsdb.localhost is for trying it on a laptop (dev-startup.sh).
    ServerAlias www.lsdb.io lsdb.localhost
    # A second DNS name for the VM, so this site can be tested through the
    # proxy before lsdb.io itself is pointed here.
    ServerAlias lsdb-alt.astro.washington.edu

    DocumentRoot /srv/lsdb.io

    <Directory /srv/lsdb.io>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
