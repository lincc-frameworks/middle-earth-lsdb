ServerName ${SERVER_NAME}

Listen 8080

# The router: the one container the VM's reverse proxy talks to. It passes
# every request, with its Host header, to whichever app container is live
# ("blue" or "green"). deploy.sh starts a new app container beside the live
# one, rewrites backend.conf to name it, and reloads this Apache gracefully:
# requests already in progress finish against the old container, new ones go
# to the new one, and no connection is dropped.

ProxyRequests Off
ProxyPreserveHost On

# Written by deploy.sh; kept in the `router-state` volume so the choice
# survives a restart of this container. Until the first deploy there is no
# backend and every request answers 503.
IncludeOptional conf/state/backend.conf

<IfFile !conf/state/backend.conf>
    RedirectMatch 503 ^
</IfFile>
